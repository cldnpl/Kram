version: '3.8'

services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/mathquest?sslmode=disable
      REDIS_URL: redis://redis:6379
      APPSTORE_ISSUER_ID: 5ae45c43-7e86-4afb-a8df-7af0a5183acb
      APPSTORE_KEY_ID: F8JCZ4JD6Y
      APPSTORE_BUNDLE_ID: com.kram.math
      APPSTORE_PRIVATE_KEY_PATH: /app/AuthKey_F8JCZ4JD6Y.p8
      APPSTORE_ENV: production
      APNS_TEAM_ID: H4M7KJL5DT
      APNS_KEY_ID: 764G76LB8V
      APNS_BUNDLE_ID: com.kram.math
      APNS_PRIVATE_KEY_PATH: /app/AuthKey_764G76LB8V.p8
      APNS_ENV: development
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mathquest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
