<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" role="img" aria-label="Unit circle (radius 1)">
  <defs>
    <style>.axis{stroke:#333;stroke-width:1}.circle{fill:none;stroke:#333;stroke-width:1.5}.angle{stroke:#1565c0;stroke-width:1.5;fill:none}.tan{stroke:#f9a825}.label{font:12px sans-serif;fill:#111}</style>
  </defs>
  <g transform="translate(170,170)">
    <circle cx="0" cy="0" r="125" class="circle"/>
