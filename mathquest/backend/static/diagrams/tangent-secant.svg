<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Tangente e secante">
  <defs>
    <style>.circle{fill:none;stroke:#333;stroke-width:2}.line{stroke:#1976d2;stroke-width:1.5}.label{font:11px sans-serif;fill:#111}</style>
  </defs>
  <circle cx="120" cy="100" r="60" class="circle"/>
