<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Basic derivatives table">
  <defs>
    <style>.head{fill:#c8e6c9}.row{fill:#ffffff}.cell{stroke:#333;stroke-width:1}.text{font:13px sans-serif;fill:#1a1a1a}.form{font:12px sans-serif;fill:#0d47a1}</style>
  </defs>
  <rect x="20" y="20" width="360" height="28" class="head cell"/>
  <line x1="200" y1="20" x2="200" y2="228" class="cell"/>
  <text x="110" y="38" class="text" text-anchor="middle">f(x)</text>
  <text x="290" y="38" class="text" text-anchor="middle">f'(x)</text>
  <rect x="20" y="48" width="360" height="28" class="row cell"/>
  <rect x="20" y="76" width="360" height="28" class="row cell"/>
  <rect x="20" y="104" width="360" height="28" class="row cell"/>
  <rect x="20" y="132" width="360" height="28" class="row cell"/>
  <rect x="20" y="160" width="360" height="28" class="row cell"/>
  <rect x="20" y="188" width="360" height="28" class="row cell"/>
  <rect x="20" y="216" width="360" height="28" class="row cell"/>
  <text x="110" y="66" class="form" text-anchor="middle">x&#x207F;</text>
  <text x="290" y="66" class="form" text-anchor="middle">n&#x22C5;x&#x207F;&#x207B;&#x2071;</text>
  <text x="110" y="94" class="form" text-anchor="middle">e&#x02E3;</text>
  <text x="290" y="94" class="form" text-anchor="middle">e&#x02E3;</text>
  <text x="110" y="122" class="form" text-anchor="middle">ln x</text>
  <text x="290" y="122" class="form" text-anchor="middle">1/x</text>
  <text x="110" y="150" class="form" text-anchor="middle">sin x</text>
  <text x="290" y="150" class="form" text-anchor="middle">cos x</text>
  <text x="110" y="178" class="form" text-anchor="middle">cos x</text>
  <text x="290" y="178" class="form" text-anchor="middle">&#x2212;sin x</text>
  <text x="110" y="206" class="form" text-anchor="middle">tan x</text>
  <text x="290" y="206" class="form" text-anchor="middle">1/cos&#xB2;x</text>
  <text x="110" y="234" class="form" text-anchor="middle">x&#x207B;&#x2071;</text>
  <text x="290" y="234" class="form" text-anchor="middle">&#x2212;1/x&#xB2;</text>
</svg>
