<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Fraction a/b">
  <defs>
    <style>.bar{stroke:#333;stroke-width:2}.num{font:bold 18px sans-serif;fill:#111}.den{font:bold 18px sans-serif;fill:#111}.label{font:11px sans-serif;fill:#444}</style>
  </defs>
  <text x="100" y="45" class="num" text-anchor="middle">a (numerator)</text>
  <line x1="40" y1="65" x2="160" y2="65" class="bar"/>
  <text x="100" y="95" class="den" text-anchor="middle">b (denominator)</text>
  <text x="100" y="125" class="label" text-anchor="middle">a/b</text>
</svg>
