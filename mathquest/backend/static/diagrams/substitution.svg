<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="Integration by substitution: u = g(x), du = g'(x) dx">
  <defs>
    <style>.box{fill:#e3f2fd;stroke:#1976d2;stroke-width:1.5}.arrow{stroke:#333;stroke-width:1.5;fill:none}.label{font:13px sans-serif;fill:#1a1a1a}</style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <rect x="20" y="30" width="120" height="36" class="box" rx="4"/>
  <text x="80" y="52" class="label" text-anchor="middle">integral f(g(x)) g'(x) dx</text>
  <path d="M 145 48 L 175 48" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="160" y="40" class="label" text-anchor="middle" font-size="11">u = g(x)</text>
  <text x="160" y="58" class="label" text-anchor="middle" font-size="11">du = g'(x) dx</text>
  <rect x="180" y="30" width="120" height="36" class="box" rx="4"/>
  <text x="240" y="52" class="label" text-anchor="middle">integral f(u) du</text>
  <text x="160" y="95" class="label" text-anchor="middle" font-size="11">Substitute back: u = g(x)</text>
  <text x="160" y="120" class="label" text-anchor="middle" font-size="12">Result: F(g(x)) + C</text>
</svg>
