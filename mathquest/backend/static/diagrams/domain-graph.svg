<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" role="img" aria-label="Domain on number line">
  <defs>
    <style>.axis{stroke:#333;stroke-width:1}.domain{fill:#c8e6c9;stroke:#2e7d32;stroke-width:1}.label{font:12px sans-serif;fill:#111}</style>
  </defs>
  <line x1="20" y1="80" x2="260" y2="80" class="axis"/>
