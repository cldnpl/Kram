<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" role="img" aria-label="Discriminant table (Delta)">
  <defs>
    <style>.head{fill:#bbdefb}.row{fill:#ffffff}.cell{stroke:#333;stroke-width:1}.text{font:13px sans-serif;fill:#1a1a1a}</style>
  </defs>
  <rect x="20" y="20" width="340" height="36" class="head cell"/>
  <rect x="20" y="56" width="340" height="32" class="row cell"/>
  <rect x="20" y="88" width="340" height="32" class="row cell"/>
  <rect x="20" y="120" width="340" height="32" class="row cell"/>
  <line x1="120" y1="20" x2="120" y2="152" class="cell"/>
  <line x1="220" y1="20" x2="220" y2="152" class="cell"/>
  <text x="70" y="42" class="text" text-anchor="middle">Delta</text>
  <text x="170" y="42" class="text" text-anchor="middle">Sign</text>
  <text x="300" y="42" class="text" text-anchor="middle">Real roots</text>
  <text x="70" y="76" class="text" text-anchor="middle">Delta &gt; 0</text>
  <text x="170" y="76" class="text" text-anchor="middle">Positive</text>
  <text x="300" y="76" class="text" text-anchor="middle">Two distinct roots</text>
  <text x="70" y="108" class="text" text-anchor="middle">Delta = 0</text>
  <text x="170" y="108" class="text" text-anchor="middle">Zero</text>
  <text x="300" y="108" class="text" text-anchor="middle">One root (double)</text>
  <text x="70" y="140" class="text" text-anchor="middle">Delta &lt; 0</text>
  <text x="170" y="140" class="text" text-anchor="middle">Negative</text>
  <text x="300" y="140" class="text" text-anchor="middle">No real roots</text>
</svg>
