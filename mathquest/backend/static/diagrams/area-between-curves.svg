<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Area between two curves y=f(x) and y=g(x)">
  <defs>
    <linearGradient id="betweenGrad" x1="0" x2="0" y1="1" y2="0"><stop offset="0%" stop-color="#c8e6c9"/><stop offset="100%" stop-color="#e8f5e9"/></linearGradient>
    <style>.axes{stroke:#666;stroke-width:1}.f{fill:none;stroke:#1976d2;stroke-width:2}.g{fill:none;stroke:#c62828;stroke-width:2}.area{fill:url(#betweenGrad);stroke:none}.label{font:12px sans-serif;fill:#1a1a1a}</style>
  </defs>
  <line x1="40" y1="160" x2="300" y2="160" class="axes"/>
  <line x1="40" y1="160" x2="40" y2="20" class="axes"/>
  <path d="M 60 155 L 100 120 L 160 85 L 220 70 L 280 95 L 280 160 Z" class="area"/>
  <path d="M 60 140 L 120 100 L 180 75 L 240 90 L 280 120 L 280 160 L 60 160 Z" class="area" opacity="0.7"/>
  <path d="M 60 155 Q 160 80 280 95" class="f"/>
  <path d="M 60 140 Q 160 95 280 120" class="g"/>
  <line x1="100" y1="160" x2="100" y2="118" stroke="#333" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="220" y1="160" x2="220" y2="72" stroke="#333" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="50" y="175" class="label">a</text>
  <text x="230" y="175" class="label">b</text>
  <text x="160" y="192" class="label" text-anchor="middle">A = integral (f(x) - g(x)) dx</text>
</svg>
