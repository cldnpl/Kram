<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Prime factorization tree for 24">
  <defs>
    <style>.box{fill:#f8f8f8;stroke:#333;stroke-width:1.5}.edge{stroke:#333;stroke-width:1}.op{font:12px sans-serif;fill:#333}</style>
  </defs>
  <!-- Root -->
  <rect x="110" y="10" width="60" height="32" class="box" rx="4"/>
  <text x="140" y="30" text-anchor="middle" class="op">24</text>
  <line x1="140" y1="42" x2="140" y2="58"/>
  <line x1="140" y1="50" x2="70" y2="50"/>
  <line x1="140" y1="50" x2="210" y2="50"/>
  <!-- 2 and 12 -->
  <rect x="30" y="58" width="50" height="28" class="box" rx="4"/>
  <text x="55" y="76" text-anchor="middle" class="op">2</text>
  <rect x="200" y="58" width="50" height="28" class="box" rx="4"/>
  <text x="225" y="76" text-anchor="middle" class="op">12</text>
  <line x1="225" y1="86" x2="225" y2="102"/>
  <line x1="225" y1="94" x2="155" y2="94"/>
  <line x1="225" y1="94" x2="295" y2="94"/>
  <!-- 12 -> 2 and 6 -->
  <rect x="125" y="102" width="50" height="28" class="box" rx="4"/>
  <text x="150" y="120" text-anchor="middle" class="op">2</text>
  <rect x="270" y="102" width="50" height="28" class="box" rx="4"/>
  <text x="295" y="120" text-anchor="middle" class="op">6</text>
  <line x1="295" y1="130" x2="295" y2="146"/>
  <line x1="295" y1="138" x2="265" y2="138"/>
  <line x1="295" y1="138" x2="310" y2="138"/>
  <!-- 6 -> 2 and 3 -->
  <rect x="235" y="146" width="50" height="28" class="box" rx="4"/>
  <text x="260" y="164" text-anchor="middle" class="op">2</text>
  <rect x="285" y="146" width="50" height="28" class="box" rx="4"/>
  <text x="310" y="164" text-anchor="middle" class="op">3</text>
  <!-- times labels -->
  <text x="95" y="52" font-size="11" fill="#555">&#xD7;</text>
  <text x="180" y="96" font-size="11" fill="#555">&#xD7;</text>
  <text x="250" y="140" font-size="11" fill="#555">&#xD7;</text>
  <!-- Result: 24 = 2^3 * 3 -->
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#333">24 = 2&#xB3; &#x22C5; 3</text>
</svg>
