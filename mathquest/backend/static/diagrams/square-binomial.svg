<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="Square of binomial (a+b)">
  <defs>
    <style>.a2{fill:#c8e6c9}.b2{fill:#bbdefb}.ab{fill:#fff9c4}.stroke{fill:none;stroke:#333;stroke-width:1.5}.label{font:bold 14px sans-serif;fill:#111}</style>
  </defs>
  <rect x="10" y="10" width="100" height="100" class="a2 stroke"/>
  <text x="60" y="65" class="label" text-anchor="middle">a^2</text>
  <rect x="110" y="10" width="100" height="100" class="ab stroke"/>
  <text x="160" y="65" class="label" text-anchor="middle">ab</text>
  <rect x="10" y="110" width="100" height="100" class="ab stroke"/>
  <text x="60" y="165" class="label" text-anchor="middle">ab</text>
  <rect x="110" y="110" width="100" height="100" class="b2 stroke"/>
  <text x="160" y="165" class="label" text-anchor="middle">b^2</text>
  <text x="60" y="5" text-anchor="middle" font-size="12">a</text>
  <text x="160" y="5" text-anchor="middle" font-size="12">b</text>
  <text x="5" y="65" text-anchor="middle" font-size="12">a</text>
  <text x="5" y="165" text-anchor="middle" font-size="12">b</text>
  <text x="130" y="245" text-anchor="middle" font-size="13">(a+b)^2 = a^2 + 2ab + b^2</text>
</svg>
