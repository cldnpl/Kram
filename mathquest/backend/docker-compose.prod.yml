version: '3.8'

services:
  api:
    image: ghcr.io/${GITHUB_OWNER}/mathquest-backend:latest
    container_name: mathquest-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      ENV: production
      APPSTORE_ISSUER_ID: 5ae45c43-7e86-4afb-a8df-7af0a5183acb
      APPSTORE_KEY_ID: F8JCZ4JD6Y
      APPSTORE_BUNDLE_ID: com.kram.math
      APPSTORE_PRIVATE_KEY_PATH: /app/AuthKey_F8JCZ4JD6Y.p8
      APPSTORE_ENV: production
      APNS_TEAM_ID: H4M7KJL5DT
      APNS_KEY_ID: 764G76LB8V
      APNS_BUNDLE_ID: com.kram.math
      APNS_PRIVATE_KEY_PATH: /app/AuthKey_764G76LB8V.p8
      APNS_ENV: production
      FIREBASE_CREDENTIALS_PATH: /app/the-big-5-15035-firebase-adminsdk-fbsvc-862e5db47e.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mathquest-network

  db:
    image: postgres:16-alpine
    container_name: mathquest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mathquest-network

  redis:
    image: redis:7-alpine
    container_name: mathquest-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - mathquest-network

networks:
  mathquest-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
