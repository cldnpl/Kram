name: mathquest
description: MathQuest - gamified math learning app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.4.3
  retrofit: ^4.1.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
